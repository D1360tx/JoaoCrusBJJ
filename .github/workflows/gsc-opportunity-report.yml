name: Joao GSC opportunity report
run-name: Joao GSC report ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID generated by the local Hermes runner
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google without a static key
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/186285028720/locations/global/workloadIdentityPools/github-actions/providers/joao-repo
          service_account: joao-gsc-reader@woven-nimbus-489418-c3.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly

      - name: Run deterministic tests
        run: python3 -m unittest tests/test_gsc_opportunity_report.py

      - name: Generate the live read-only report
        env:
          GSC_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GSC_QUOTA_PROJECT: woven-nimbus-489418-c3
        run: >-
          python3 scripts/gsc_opportunity_report.py
          --output /tmp/joao-gsc-opportunities.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: joao-gsc-${{ inputs.request_id }}
          path: /tmp/joao-gsc-opportunities.md
          if-no-files-found: error
          retention-days: 7
