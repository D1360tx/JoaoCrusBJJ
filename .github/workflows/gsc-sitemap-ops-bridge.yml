name: Joao GSC sitemap operations bridge
run-name: Joao GSC sitemap ops ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID generated by the local caller
        required: true
        type: string
      phase:
        description: Plan is pure; execute authenticates and rechecks provider state
        required: true
        type: choice
        options:
          - plan
          - execute
      idempotency_key:
        description: Request ID for plan; exact plan hash for execute
        required: true
        type: string
      payload:
        description: Base64url JSON containing one bounded request and recipient public key
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: joao-gsc-sitemap-${{ inputs.idempotency_key }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: gsc-production-write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install locked bridge dependencies
        run: python -m pip install --requirement requirements/gsc-bridge.lock.txt

      - name: Run deterministic GSC bridge tests
        run: python -m unittest tests/test_gsc_operational_bridge.py

      - name: Authenticate as the isolated GSC operator
        if: inputs.phase == 'execute'
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GSC_OPERATOR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: joao-gsc-operator@woven-nimbus-489418-c3.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
          create_credentials_file: false

      - name: Dispatch one allowlisted sitemap plan or execution
        env:
          GSC_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GSC_OPS_REQUEST_B64: ${{ inputs.payload }}
          GSC_EXPECTED_PHASE: ${{ inputs.phase }}
          GSC_EXPECTED_IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
        run: >-
          python scripts/gsc_sitemap_ops_workflow_dispatch.py
          --output "${RUNNER_TEMP}/joao-gsc-sitemap-result.encrypted.json"

      - name: Upload encrypted one-day result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: joao-gsc-sitemap-result-encrypted
          path: ${{ runner.temp }}/joao-gsc-sitemap-result.encrypted.json
          if-no-files-found: error
          retention-days: 1
