name: Joao GA4 read-only bridge
run-name: Joao GA4 bridge ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID generated by the local Hermes wrapper
        required: true
        type: string
      payload:
        description: Base64url JSON containing the requested tool and args
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install locked bridge dependencies
        run: python -m pip install --requirement requirements/ga4-bridge.lock.txt

      - name: Run deterministic bridge tests
        run: python -m unittest tests/test_ga4_workflow_dispatch.py

      - name: Authenticate to Google without a static key
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/186285028720/locations/global/workloadIdentityPools/github-actions/providers/joao-repo
          service_account: joao-ga4-reader@woven-nimbus-489418-c3.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: true
          export_environment_variables: true

      - name: Dispatch one read-only GA4 tool
        env:
          GA4_REQUEST_B64: ${{ inputs.payload }}
        run: >-
          python scripts/ga4_workflow_dispatch.py
          --output "${RUNNER_TEMP}/joao-ga4-result.encrypted.json"

      - name: Upload encrypted JSON result artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: joao-ga4-result-encrypted
          path: ${{ runner.temp }}/joao-ga4-result.encrypted.json
          if-no-files-found: error
          retention-days: 1
